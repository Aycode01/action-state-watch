<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Accent Gradient for Text / Borders -->
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Base Card Background -->
  <rect width="800" height="220" rx="16" fill="url(#bg-gradient)"/>
  <rect width="800" height="220" rx="16" fill="url(#grid)"/>

  <!-- Border Highlight -->
  <rect width="798" height="218" x="1" y="1" rx="15" fill="none" stroke="url(#accent-gradient)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Ambient Glow Circles -->
  <circle cx="120" cy="110" r="80" fill="#38BDF8" fill-opacity="0.1" filter="url(#glow)"/>
  <circle cx="680" cy="110" r="90" fill="#C084FC" fill-opacity="0.1" filter="url(#glow)"/>

  <!-- Top Pill / Category -->
  <g transform="translate(48, 42)">
    <rect width="175" height="26" rx="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="14" cy="13" r="4" fill="#38BDF8"/>
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1">STELLAR ARCHIVAL LABS</text>
  </g>

  <!-- Repository Title -->
  <text x="48" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#accent-gradient)" letter-spacing="-0.5">action-state-watch</text>

  <!-- Tagline / Description -->
  <text x="48" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94A3B8">Scheduled TTL &amp; Archival Health Monitoring for Soroban Smart Contracts</text>

  <!-- Decorative Status Pulse Graphic -->
  <g transform="translate(680, 85)">
    <!-- Pulse Rings -->
    <circle cx="40" cy="35" r="32" fill="none" stroke="#818CF8" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
    <circle cx="40" cy="35" r="22" fill="#1E1B4B" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="40" cy="35" r="8" fill="#38BDF8" filter="url(#glow)"/>
  </g>
</svg>
